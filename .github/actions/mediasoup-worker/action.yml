name: Mediasoup worker
description: Point mediasoup at its prebuilt worker before bun install. Requires checkout before use.

runs:
  using: composite
  steps:
    - name: Download the prebuilt mediasoup worker
      shell: bash
      run: |
        version=$(grep -oE '"mediasoup@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -1 | tr -d '"' | cut -d@ -f2)
        dir="$RUNNER_TEMP/mediasoup-worker"

        mkdir -p "$dir"
        curl -fsSL "https://github.com/versatica/mediasoup/releases/download/$version/mediasoup-worker-$version-linux-x64-kernel6.tgz" | tar -xz -C "$dir"

        # the install script skips its build when this is set, and mediasoup runs this binary
        echo "MEDIASOUP_WORKER_BIN=$dir/mediasoup-worker" >> "$GITHUB_ENV"
