name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  windows-audio:
    name: Windows audio helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native helper
        run: node apps/desktop/native/windows-audio/build.cjs
      - name: Reject invalid capture targets
        run:
          node --test --test-name-pattern="invalid"
          apps/desktop/native/windows-audio/test.cjs

  checks:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Format check
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun check-types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Run tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sharkord

      - name: Build
        working-directory: apps/server
        run: bun run build
