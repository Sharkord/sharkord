appId: com.sharkord.desktop
productName: Sharkord
directories:
  buildResources: build
files:
  - out/**
protocols:
  - name: Sharkord
    schemes:
      - sharkord
mac:
  category: public.app-category.social-networking
  target: dmg
linux:
  category: Network
  target: AppImage
  executableName: sharkord
  syncDesktopName: true
win:
  target: nsis
