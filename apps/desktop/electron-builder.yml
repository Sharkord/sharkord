appId: com.sharkord.Sharkord
productName: Sharkord
extraMetadata:
  name: sharkord-app
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - out/**
npmRebuild: false
asarUnpack:
  - out/main/chunks/*.png
protocols:
  - name: Sharkord
    schemes:
      - sharkord
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.social-networking
  extendInfo:
    NSMicrophoneUsageDescription:
      Sharkord uses the microphone for voice channels.
    NSCameraUsageDescription:
      Sharkord uses the camera for video in voice channels.
    NSAudioCaptureUsageDescription:
      Sharkord captures system audio when you share your screen with sound.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
linux:
  category: Network
  target: AppImage
  executableName: sharkord
  syncDesktopName: true
win:
  target: nsis
publish:
  provider: github
  owner: Sharkord
  repo: sharkord-desktop
  releaseType: draft
  updaterCacheDirName: sharkord-app-updater
