appId: com.sharkord.Sharkord
productName: Sharkord
extraMetadata:
  name: sharkord-app
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - out/**
npmRebuild: false
asarUnpack:
  - out/main/chunks/*.png
protocols:
  - name: Sharkord
    schemes:
      - sharkord
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.social-networking
  extendInfo:
    NSMicrophoneUsageDescription:
      Sharkord uses the microphone for voice channels.
    NSCameraUsageDescription:
      Sharkord uses the camera for video in voice channels.
  # the zip is what the auto updater downloads on macos
  target:
    - dmg
    - zip
linux:
  category: Network
  target: AppImage
  executableName: sharkord
  syncDesktopName: true
win:
  target: nsis
# desktop releases live in their own repo, the server updater reads the latest
# release of Sharkord/sharkord and would pick up a desktop one there
publish:
  provider: github
  owner: Sharkord
  repo: sharkord-desktop
  releaseType: draft
  updaterCacheDirName: sharkord-app-updater
